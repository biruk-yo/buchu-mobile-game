plugins { id 'com.android.application' }
android {
    namespace 'com.tirerun.game'
    compileSdk 36
    defaultConfig {
        applicationId 'com.tirerun.game'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'com.tirerun.game.VisualCheck'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
